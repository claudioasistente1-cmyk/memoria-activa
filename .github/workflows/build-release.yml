name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version a compilar (X.Y.Z). Vacio usa version.properties'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="$(grep '^versionName=' version.properties | cut -d= -f2)"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version invalida: $VERSION (usar X.Y.Z)"
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))
          printf 'versionCode=%s\nversionName=%s\n' "$CODE" "$VERSION" > version.properties
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Restore signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo "::error::Falta el secret SIGNING_KEYSTORE_BASE64. Ver README (Firma y publicacion)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release.jks"

      - name: Build and test
        shell: bash
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          UPDATE_MANIFEST_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/update.json
          CONTENT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/content.json
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean test assembleRelease

      - name: Prepare artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          SRC="$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"
          NAME="memoria-activa-${VERSION}.apk"
          cp "$SRC" "$NAME"
          SHA="$(sha256sum "$NAME" | awk '{print $1}')"
          SIZE="$(stat -c%s "$NAME")"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "APK: $NAME ($SIZE bytes)"
          echo "SHA-256: $SHA"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: memoria-activa-apk
          path: ${{ steps.artifact.outputs.name }}
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          if [[ -f RELEASE_NOTES.md ]]; then
            NOTES="$(cat RELEASE_NOTES.md)"
          else
            NOTES="Mejoras y correcciones generales."
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${{ steps.artifact.outputs.name }}" --clobber
          else
            gh release create "$TAG" "${{ steps.artifact.outputs.name }}" \
              --title "Memoria Activa ${VERSION}" \
              --notes "$NOTES" \
              --verify-tag
          fi

      - name: Build Pages content
        if: github.event_name == 'push'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.code }}
          SHA: ${{ steps.artifact.outputs.sha }}
          SIZE: ${{ steps.artifact.outputs.size }}
        run: |
          set -euo pipefail
          mkdir -p docs
          cp app/src/main/assets/content.json docs/content.json
          if [[ -f RELEASE_NOTES.md ]]; then
            NOTES="$(cat RELEASE_NOTES.md)"
          else
            NOTES="Mejoras y correcciones generales."
          fi
          APK_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/memoria-activa-${VERSION}.apk"
          jq -n \
            --argjson versionCode "$CODE" \
            --arg versionName "$VERSION" \
            --arg apkUrl "$APK_URL" \
            --arg sha256 "$SHA" \
            --arg releaseNotes "$NOTES" \
            --argjson apkSizeBytes "$SIZE" \
            --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{versionCode:$versionCode,versionName:$versionName,apkUrl:$apkUrl,sha256:$sha256,releaseNotes:$releaseNotes,apkSizeBytes:$apkSizeBytes,minSdk:28,publishedAt:$publishedAt}' \
            > docs/update.json
          cat docs/update.json

      - name: Publish GitHub Pages
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages

      - name: Enable GitHub Pages
        if: github.event_name == 'push'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY='{"source":{"branch":"gh-pages","path":"/"}}'
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d "$BODY" > /dev/null || \
          curl -s -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d "$BODY" > /dev/null
